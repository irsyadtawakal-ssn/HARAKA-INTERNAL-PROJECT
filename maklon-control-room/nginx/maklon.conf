# ============================================================
#  Nginx Configuration — Maklon Control Room
#  Lokasi di VPS: /etc/nginx/sites-available/maklon.conf
#  Symlink: ln -s /etc/nginx/sites-available/maklon.conf /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 80;
    server_name roomadmin.harakaerfi.com;

    # Redirect HTTP ke HTTPS (otomatis diaktifkan jika menggunakan Certbot)
    # return 301 https://$host$request_uri;

    # Log file
    access_log /var/log/nginx/maklon_access.log;
    error_log /var/log/nginx/maklon_error.log;

    # Maksimum ukuran upload payload
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy ke aplikasi Node.js (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings (penting saat AI memproses request yang agak lama)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
