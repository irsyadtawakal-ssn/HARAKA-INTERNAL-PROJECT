<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 { margin: 0 0 12px; font-size: 15px; color: #38bdf8; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
    }
    #msg { font-size: 11px; color: #fbbf24; margin-top: 8px; min-height: 16px; }
    #job { font-size: 11px; color: #cbd5e1; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>Haraka Flow Render Bridge</h3>

  <label for="backendUrl">Alamat backend</label>
  <input id="backendUrl" placeholder="https://api.haraka-factory.id" autocomplete="off" />

  <label for="deviceToken">Token device</label>
  <input id="deviceToken" type="password" placeholder="Dari POST /render-devices" autocomplete="off" />

  <button id="saveBtn" class="btn">Simpan &amp; uji</button>

  <div id="msg"></div>
  <div id="job"></div>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
